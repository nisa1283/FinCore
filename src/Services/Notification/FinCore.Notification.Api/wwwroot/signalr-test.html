<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FinCore SignalR Test</title>
</head>
<body style="font-family: sans-serif; max-width: 700px; margin: 2rem auto;">
  <h2>FinCore SignalR Test</h2>
  <p>Access token'ı yapıştır, Connect'e bas.</p>
  <textarea id="token" rows="4" style="width: 100%;" placeholder="Access token"></textarea>
  <br /><br />
  <button id="connect">Connect</button>
  <pre id="log" style="background: #f4f4f4; padding: 1rem; white-space: pre-wrap;"></pre>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script>
    const log = (m) => (document.getElementById('log').textContent += m + '\n');

    document.getElementById('connect').onclick = async () => {
      const token = document.getElementById('token').value.trim();

      const connection = new signalR.HubConnectionBuilder()
        .withUrl('/hubs/notifications', { accessTokenFactory: () => token })
        .withAutomaticReconnect()
        .build();

      connection.on('notificationReceived', (n) => log('NEW: ' + JSON.stringify(n)));

      try {
        await connection.start();
        log('Connected.');
      } catch (e) {
        log('Error: ' + e);
      }
    };
  </script>
</body>
</html>
